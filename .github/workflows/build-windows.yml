
name: Build AksChin for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name AksChin --collect-all tkinterdnd2 akschin.py

      - name: Install Inno Setup
        run: choco install innosetup --yes

      - name: Build Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Windows files
        uses: actions/upload-artifact@v4
        with:
          name: AksChin-Windows-Installer
          path: |
            dist/AksChin.exe
            installer-output/AksChin-Setup.exe
